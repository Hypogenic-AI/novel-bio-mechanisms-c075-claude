[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace: Discovering Novel Biological Mechanisms from Protein Language Models"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.103.1",
    "arxiv>=4.0.0",
    "biopython>=1.87",
    "datasets>=4.8.5",
    "einops>=0.8.2",
    "h5py>=3.16.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.15.0",
    "hydra-core>=1.3.2",
    "matplotlib>=3.10.9",
    "omegaconf>=2.3.0",
    "openai>=2.37.0",
    "pypdf>=6.11.0",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "safetensors>=0.7.0",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "torch>=2.12.0",
    "transformers>=5.8.1",
    "umap-learn>=0.5.12",
    "wandb>=0.27.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu121"
